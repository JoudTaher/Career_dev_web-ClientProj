<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 144" role="img" aria-labelledby="title description">
  <title id="title">UMSI logo placeholder</title>
  <desc id="description">A temporary graphic marking where the official University of Michigan School of Information logo should be added.</desc>
  <rect width="288" height="144" rx="12" fill="#ffffff"/>
  <rect x="5" y="5" width="278" height="134" rx="8" fill="none" stroke="#ffcb05" stroke-width="10" stroke-dasharray="18 12"/>
  <text x="144" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#00274c">UMSI</text>
  <text x="144" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#00274c">LOGO PLACEHOLDER</text>
</svg>
